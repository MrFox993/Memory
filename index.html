<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
    <link rel="shortcut icon" href="/icons/favicon.ico" type="image/x-icon">
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <section id="startScreen" class="start-screen">
      <div>
        <h2>It's play time.</h2>
        <h1>Ready to play?</h1>
      </div>
      <button class="primary-button" id="showSettingsButton">
        <img src="/icons/stadia_controller_icon.png" alt="controller icon" />
        <p>Play</p>
        <img class="arrow" src="/icons/Arrow_right.png" alt="arrow right" />
      </button>
    </section>
    <section id="settingsScreen" class="hide settings-screen">
      <div class="left-split">
        <div class="heading">
          <h1>Settings</h1>
          <img src="/icons/square_underline.png" alt="heading underline" />
        </div>
        <div class="game-themes-selection">
          <div class="game-theme-headline">
            <img src="/icons/palette.png" alt="game theme icon" />
            <h2>Game Themes</h2>
          </div>
          <div class="game-themes-options">
            <div>
              <input
                type="radio"
                name="game-themes"
                id="codeVibesTheme"
                checked
              />
              <label for="codeVibesTheme">Code vibes theme</label>
            </div>
            <div>
              <input type="radio" name="game-themes" id="gamingTheme" />
              <label for="gamingTheme">Gaming theme</label>
            </div>
            <div>
              <input type="radio" name="game-themes" id="DAProjectTheme" />
              <label for="DAProjectTheme">DA project theme</label>
            </div>
            <div>
              <input type="radio" name="game-themes" id="foodsTheme" />
              <label for="foodsTheme">Foods theme</label>
            </div>
          </div>
        </div>
        <div class="player-selection">
          <div class="player-selection-headline">
            <img src="/icons/chess_pawn.png" alt="player icon" />
            <h2>Choose Player</h2>
          </div>
          <div class="player-selection-options">
            <div>
              <input type="radio" name="player-selection" id="bluePlayer" />
              <label for="bluePlayer">Blue</label>
            </div>
            <div>
              <input type="radio" name="player-selection" id="orangePlayer" />
              <label for="orangePlayer">Orange</label>
            </div>
          </div>
        </div>
        <div class="board-size-selection">
          <div class="board-size-selection-headline">
            <img src="/icons/board_size.png" alt="board size icon" />
            <h2>Board Size</h2>
          </div>
          <div class="board-size-selection-options">
            <div>
              <input type="radio" name="board-size-selection" id="sizeS" />
              <label for="sizeS">16 Cards</label>
            </div>
            <div>
              <input type="radio" name="board-size-selection" id="sizeM" />
              <label for="sizeM">24 Cards</label>
            </div>
            <div>
              <input type="radio" name="board-size-selection" id="sizeL" />
              <label for="sizeL">32 Cards</label>
            </div>
          </div>
        </div>
      </div>
      <div class="right-split">
        <div class="game-theme-preview">
          <img
            id="themePreview"
            src="/assets/code_vibes_theme_preview.png"
            alt="theme preview image"
          />
        </div>
        <div class="selection-overview" aria-label="Chosen settings">
          <output
            id="selectedTheme"
            class="selection-overview__item"
            data-placeholder="Theme"
            >Theme</output
          >
          <img
            class="selection-overview__divider"
            src="/icons/diagonale_line.png"
            alt=""
          />
          <output
            id="selectedPlayer"
            class="selection-overview__item"
            data-placeholder="Player"
            >Player</output
          >
          <img
            class="selection-overview__divider"
            src="/icons/diagonale_line.png"
            alt=""
          />
          <output
            id="selectedBoardSize"
            class="selection-overview__item"
            data-placeholder="Board size"
            >Board size</output
          >
          <button
            id="startGameButton"
            class="selection-overview__start primary-button"
            type="button"
            disabled
          >
            <img src="/icons/start_game_icon.png" alt="" aria-hidden="true" />
            Start
          </button>
        </div>
      </div>
    </section>
    <section id="gameScreen" class="hide game-screen" aria-label="Memory game">
      <header class="game-header">
        <div class="game-score" aria-label="Player scores">
          <div
            id="blueScoreCard"
            class="game-score__player"
            aria-label="Blue player score"
          >
            <img
              class="game-score__pawn"
              src="/icons/blue_player_pawn.png"
              alt="Blue player"
            />
            <strong id="blueScore" class="game-score__value">0</strong>
          </div>
          <div
            id="orangeScoreCard"
            class="game-score__player"
            aria-label="Orange player score"
          >
            <img
              class="game-score__pawn"
              src="/icons/orange_player_pawn.png"
              alt="Orange player"
            />
            <strong id="orangeScore" class="game-score__value">0</strong>
          </div>
        </div>
        <div
          id="activePlayerDisplay"
          class="game-active-player"
          aria-live="polite"
        >
          <span>Current player:</span>
          <img
            id="activePlayerPawn"
            class="game-active-player__pawn"
            src="/icons/blue_player_pawn.png"
            alt="Blue player"
          />
        </div>
        <button
          id="exitGameButton"
          class="game-exit-button secondary-button"
          type="button"
        >
          <img src="/icons/exit_icon.png" alt="exit icon" />
          <p>Exit game</p>
        </button>
      </header>
      <main class="game-board-wrap">
        <div id="gameBoard" class="game-board" aria-label="Memory cards"></div>
      </main>
      <div
        id="quitGameDialog"
        class="quit-dialog hide"
        role="dialog"
        aria-modal="true"
        aria-labelledby="quitGameDialogTitle"
      >
        <div class="quit-dialog__content">
          <h2 id="quitGameDialogTitle">
            Are you sure you want to quit the game?
          </h2>
          <div class="quit-dialog__actions">
            <button
              id="backToGameButton"
              class="quit-dialog__button quit-dialog__button--secondary"
              type="button"
            >
              Back to game
            </button>
            <button
              id="confirmQuitGameButton"
              class="quit-dialog__button quit-dialog__button--primary"
              type="button"
            >
              Yes, quit game
            </button>
          </div>
        </div>
      </div>
      <template id="memoryCardTemplate">
        <button class="memory-card" type="button">
          <span class="memory-card__inner">
            <span
              class="memory-card__face memory-card__face--back"
              aria-hidden="true"
            >
              <img class="memory-card__image memory-card__image--back" alt="" />
            </span>
            <span class="memory-card__face memory-card__face--front">
              <img
                class="memory-card__image memory-card__image--front"
                alt=""
              />
            </span>
          </span>
        </button>
      </template>
    </section>
    <section
      id="gameOverScreen"
      class="hide end-screen end-screen--game-over"
      aria-live="polite"
    >
      <div id="gameOverPanel" class="end-screen__panel">
        <h1 class="end-screen__title">Game Over</h1>
        <div class="final-score" aria-label="Final score">
          <div class="final-score__player">
            <img
              class="final-score__pawn"
              src="/icons/blue_player_pawn.png"
              alt="Blue player"
            />
            <strong id="finalBlueScore" class="final-score__value">0</strong>
          </div>
          <div class="final-score__player">
            <img
              class="final-score__pawn"
              src="/icons/orange_player_pawn.png"
              alt="Orange player"
            />
            <strong id="finalOrangeScore" class="final-score__value">0</strong>
          </div>
        </div>
      </div>
    </section>
    <section
      id="winnerScreen"
      class="hide end-screen end-screen--winner"
      aria-live="polite"
    >
      <img
        id="winnerConfetti"
        class="end-screen__confetti hide"
        src="/icons/Confetti.png"
        alt=""
        aria-hidden="true"
      />
      <div class="end-screen__panel">
        <h1 id="winnerStatus" class="end-screen__title">The Winner is Blue</h1>
        <img
          id="winnerImage"
          class="end-screen__winner-image"
          src="/icons/blue_player_pawn.png"
          alt="Blue player"
        />
        <button id="backToStartButton" class="end-screen__button" type="button">
          Back To Start
        </button>
      </div>
    </section>
  </body>
</html>
