<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <section id="startScreen" class="hide start-screen">
        <div>
            <h2>It's play time.</h2>
            <h1>Ready to play?</h1>
        </div>
        <button class="primary-button">
            <img src="./icons/stadia_controller_icon.png" alt="controller icon">
            <p>Play</p>
            <img class="arrow" src="./icons/Arrow_right.png" alt="arrow right">
        </button>
    </section>
    <section id="settingsScreen" class="settings-screen">
        <div class="left-split">
            <div class="heading">
                <h1>Settings</h1>
                <!-- <p class="heading-underline"></p> -->
                <img src="./icons/square_underline.png" alt="heading underline">
            </div>
            <div class="game-themes-selection">
                <div class="game-theme-headline">
                    <img src="./icons/palette.png" alt="game theme icon">
                    <h2>Game Themes</h2>
                </div>
                <div class="game-theme-options">
                    <div>
                        <ul>
                            <li><button>Code vibes theme</button></li>
                            <li><button>Gaming theme</button></li>
                            <li><button>DA project theme</button></li>
                            <li><button>Foods theme</button></li>
                        </ul>
                        
                    </div>
                </div>
            </div>
            <div class="player-selection"></div>
            <div class="board-size-selection"></div>
        </div>
        <div class="right-split">
            <div class="game-theme-preview"></div>
            <div class="selection-overview"></div>
        </div>
    </section>
</body>
</html>
